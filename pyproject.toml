[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoptlab"
version = "0.1.0"
description = "An extensible laboratory for inverse-optimization experiments, geometry, statistics, and visualization."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Payam"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "plotly>=5.18", "kaleido>=0.2"]
convex = ["cvxpy>=1.4"]
notebooks = ["jupyterlab>=4", "nbformat>=5.9", "nbclient>=0.10", "ipywidgets>=8"]
reports = ["jinja2>=3.1", "pyyaml>=6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
all = [
  "matplotlib>=3.7", "plotly>=5.18", "kaleido>=0.2",
  "cvxpy>=1.4", "jupyterlab>=4", "nbformat>=5.9", "nbclient>=0.10", "ipywidgets>=8",
  "jinja2>=3.1", "pyyaml>=6", "pytest>=8", "pytest-cov>=5", "ruff>=0.6",
]

[project.scripts]
invoptlab = "invoptlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
